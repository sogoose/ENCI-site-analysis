name: Cache mobility data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-mobility.yml'
permissions:
  contents: write
concurrency:
  group: enci-mobility
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mapped facilities and local route segments
        run: python scripts/cache-mobility.py
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/context/mobility.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store mapped mobility facilities and route segments"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
