<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ENCI — Site analysis</title><meta name="description" content="ENCI, Maastricht — site analysis"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head>
<body>
<div id="viewport" aria-label="Interactive terrain model"></div>
<header><a class="wordmark" href="./">ENCI<span> / Maastricht</span></a><nav id="modes" aria-label="Analysis"><button data-mode="terrain" class="active">Terrain</button><button data-mode="environment">Environment</button><button data-mode="access">Access</button><button data-mode="sections">Sections</button><button data-mode="views">Views</button></nav><button class="icon" id="fullscreen" title="Full screen" aria-label="Full screen">⛶</button></header>
<div id="drawer" hidden><div id="options"></div><button class="icon close" id="close" aria-label="Close options">×</button></div>
<div class="tools"><button id="axo" aria-label="Axonometric camera" title="Axonometric">AXO</button><button id="plan" aria-label="Plan camera" title="Plan">PLAN</button><button id="fit" title="Fit model">FIT</button><button id="export-layer" title="Download the selected terrain as a separate GLB" aria-label="Export selected terrain">↓</button><button id="local" title="Preview a local GLB file">↥</button><input type="file" id="file" accept=".glb" hidden></div>
<div id="status" role="status">Loading terrain…</div>
<div id="profile" hidden></div>
<div id="photo" hidden></div>
<footer><div class="date-line"><div id="date">2010</div><div id="source">Historical reconstruction</div><div class="footer-tools"><button id="stack" title="Compare historical terrain as an exploded stack">Stack</button><button id="detail" hidden>Detail</button></div></div><div id="timeline" aria-label="Terrain dates"></div><div class="footnote"><span>50°49′ N / 005°41′ E · m NAP</span><span id="hint">Drag to orbit / scroll to zoom</span><button id="inspect-layers" title="Download Rhino layer inspection report">Layers ↓</button><a href="./README.md" target="_blank" rel="noopener">Data ↗</a></div></footer>
<script type="module">import('./app.js?v=2').catch(e=>{document.getElementById('status').textContent='Viewer could not start: '+e.message;console.error(e)});</script></body></html>
