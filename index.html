<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex, noarchive, noimageindex, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ENCI — Site analysis</title><meta name="description" content="ENCI, Maastricht — site analysis"><link rel="stylesheet" href="./style.css?v=37"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head>
<body>
<div id="viewport" aria-label="Interactive terrain model"></div><div id="stack-labels" hidden></div><div id="section-pins" aria-label="Select a section" hidden></div>
<header><a class="wordmark" href="./">ENCI<span> / Maastricht</span></a><nav id="modes" aria-label="Analysis"><button data-mode="terrain" class="active">Terrain</button><button data-mode="environment">Environment</button><button data-mode="access">Access</button><button data-mode="sections">Sections</button><button data-mode="views">Views</button></nav><button class="icon" id="fullscreen" title="Full screen" aria-label="Full screen">⛶</button></header>
<div id="drawer" hidden><div id="options"></div><button class="icon close" id="close" aria-label="Close options">×</button></div>
<div class="tools"><div class="turn-tools"><button id="rotate-left" title="Rotate left 15°" aria-label="Rotate left">↶</button><button id="rotate-right" title="Rotate right 15°" aria-label="Rotate right">↷</button></div><button id="axo" aria-label="Axonometric camera" title="Axonometric">AXO</button><button id="plan" aria-label="Plan camera" title="Plan">PLAN</button><button id="fit" title="Fit model">FIT</button><button id="export-layer" title="Download the selected terrain as a separate GLB" aria-label="Export selected terrain">↓</button><button id="local" title="Preview a local GLB file">↥</button><input type="file" id="file" accept=".glb" hidden></div>
<div id="status" role="status">Loading terrain…</div>
<div id="map-legend" hidden></div><div id="map-measure" hidden aria-label="Map orientation and horizontal scale"><div class="north-unit" title="Model grid north"><span>N</span><svg id="north-arrow" viewBox="0 0 22 29" width="17" height="23" aria-hidden="true"><path d="M11 1 L19 25 L11 19 L3 25 Z" fill="white" stroke="currentColor" stroke-width="1"/><path d="M11 1 L11 19 L3 25 Z" fill="currentColor"/></svg></div><div class="scale-unit" title="Horizontal ground scale in model metres"><div id="scale-bar"></div><div class="scale-label"><span>0</span><span id="scale-end">100 m</span></div></div></div><div id="profile" hidden></div>
<svg id="photo-lines" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden></svg><div id="photo-markers" aria-label="Photograph locations" hidden></div><div id="photo" hidden></div>
<footer><div class="date-line"><div id="date">2026</div><div id="source">Current terrain</div><div class="footer-tools"><label id="stack-spacing" hidden>Spacing <input id="spacing" type="range" min="350" max="1100" step="50" value="650" aria-label="Stack spacing"></label><button id="stack" title="Compare historical terrain as an exploded stack">Stack</button><button id="detail" hidden>Detail</button></div></div><div id="timeline" aria-label="Terrain dates"></div><div class="footnote"><span>50°49′ N / 005°41′ E · m NAP</span><span id="hint">Right drag: orbit · Shift + right drag: pan · Wheel: zoom</span><button id="inspect-layers" title="Download Rhino layer inspection report">Layers ↓</button><a class="bag-credit" href="https://docs.3dbag.nl/en/copyright/" target="_blank" rel="noopener">© 3DBAG by tudelft3d and 3DGI</a><a id="osm-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a><a href="./sources.html" target="_blank" rel="noopener">Sources / credits ↗</a></div></footer>
<script type="module">import('./app.js?v=37').catch(e=>{document.getElementById('status').textContent='Viewer could not start: '+e.message;console.error(e)});</script></body></html>
